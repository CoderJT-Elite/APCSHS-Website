kind = "web"
previewPath = "/"
title = "Grand Blanc CS Honor Society"
version = "1.0.0"
id = "artifacts/gbcshs"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23356

[services.development]
run = "pnpm --filter @workspace/gbcshs run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gbcshs", "run", "build" ]
publicDir = "artifacts/gbcshs/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23356"
BASE_PATH = "/"
